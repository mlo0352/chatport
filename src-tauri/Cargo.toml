[package]
name = "chatport"
version = "0.3.0"
description = "Local conversation manager"
default-run = "chatport"
authors = ["ChatPort contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
